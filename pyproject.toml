[project]
name = "crypto-attacks"
version = "0.1.0"
description = "Implémentations pédagogiques d'attaques cryptographiques classiques"
requires-python = ">=3.10"
dependencies = [
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["padding_oracle"]
